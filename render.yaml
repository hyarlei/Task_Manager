services:
  - type: web
    name: task-manager-backend
    runtime: node
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://task-manager-frontend.onrender.com